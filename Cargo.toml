[package]
name = "gtx-browser"
version = "0.1.0"
edition = "2024"
description = "GTX Browser — an extremely lightweight, no-bloat web browser for Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
wry = { version = "0.57", features = ["devtools"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Networking_WinHttp",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
    "Win32_Security",
  "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Performance-oriented, minimal-footprint release build.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
